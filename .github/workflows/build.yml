name: Build app

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
            # One dmg that runs on both Apple Silicon and Intel Macs.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev libfuse2 \
            clang libclang-dev libpipewire-0.3-dev libdbus-1-dev \
            libx11-dev libxcb1-dev pkg-config

      - name: Install JS deps
        run: npm install

      - name: Fetch ffmpeg (bundled for video recording)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          $exe = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination src-tauri/binaries/ffmpeg.exe -Force
          Write-Host "ffmpeg bundled at src-tauri/binaries/ffmpeg.exe"

      - name: Build app
        run: npm run build -- ${{ matrix.tauri-args }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            windows)
              cp -v src-tauri/target/release/bundle/nsis/*.exe dist/ || true
              cp -v src-tauri/target/release/*.exe dist/ || true
              ;;
            linux)
              cp -v src-tauri/target/release/bundle/deb/*.deb dist/ || true
              cp -v src-tauri/target/release/bundle/rpm/*.rpm dist/ || true
              cp -v src-tauri/target/release/bundle/appimage/*.AppImage dist/ || true
              ;;
            macos)
              cp -v src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/ || true
              ;;
          esac
          ls -la dist
          test -n "$(ls -A dist)" # fail the job if nothing was bundled

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: lightshot-we-deserve-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
